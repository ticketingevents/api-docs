type: object
properties:
  recipient:
    type: "string"
    pattern: "^[A-Z]{2}-[A-Z0-9]{8}$"
    description: "Unique identifier of the account receiving this transfer"
  tickets:
    type: array
    description: Tiers for which to transfer tickets.
    items:
      type: object
      properties:
        tier:
          type: "integer"
          description: "Unique identfier of the tier to be included in the transfer"
        quantity:
          type: "number"
          description: "The number of instances in the identified tier to include in the transfer"
              