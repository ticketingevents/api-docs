type: object
required:
  - items
properties:
  items:
    description: Tiers for which to order tickets.
    type: array
    items:
      type: object
      properties:
        tier:
          type: "integer"
          description: "Unique identfier of the tier to be included in the order"
        quantity:
          type: "number"
          description: "The number of instances in the identified tier to include in the order"
        details:
          type: "array"
          description: "Additional details provided by the customer for each ticket being purchased"
          items:
            type: "object"
            "additionalProperties":
              "type": "string"