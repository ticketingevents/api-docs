type: object
required:
  - items
properties:
  items:
    description: Sections for which to order tickets. The object's keys
      are the URI of the event section for which tickets are being ordered, while its values
      are the number of tickets to order for the section.
    type: array
    items:
      type: object
      properties:
        tier:
          type: "integer"
          description: "Unique identfier of the tier to be included in the order"
        quantity:
          type: "number"
          description: "The number of instances in the identified tier to include in the order"