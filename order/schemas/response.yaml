type: "object"
properties:
  self:
    type: "string"
    format: "uri"
    description: "URI of the order resource"
  number:
    type: "string"
    description: "Unique identifier of the order"
  status:
    type: "string"
    description: "Current status of the order"
  placed:
    type: "string"
    format: "date-time"
    description: "The date and time at which the order was placed"
  subtotal:
    type: "number"
    format: "float"
    description: "Total cost of the ordered items, before convenience fees are applied"
  fees:
    type: "number"
    format: "float"
    description: "Total applicable convenience fees for this order"
  total:
    type: "number"
    format: "float"
    description: "Total to be paid for this order inclusive of item costs (subtotal) and fees"
  items:
    type: "array"
    description: |
      List of items that were ordered
    items:
      type: "object"
      properties:
        tier:
          type: "object"
          description: "Details of the ordered tier"
          properties:
            $ref: "../../tier/listing/schemas/response.yaml#/properties"
        quantity:
          type: "number"
          description: "Number of instances of this item that were ordered"
  payment:
    type: "object"
    description: "Details of the payment for this order."
    properties:
      uri:
        type: "string"
        format: "uri"
        description: "URI used for completing order payment."
      status:
        type: "string"
        enum: ["Pending", "Completed", "Failed", "Cancelled"]
        description: "Current order payment status"
      method:
        type: "object"
        description: "Details of the method used to complete payment"
        properties:
          cardholder:
            type: "string"
            description: "Name of the payment card holder as printed on the card"
          card_type:
            type: "string"
            description: "The type of card used to complete payment (Visa, Mastercard, etc.)"
          card_digits:
            type: "string"
            description: "Last 4 digits of the card used to complete payment"